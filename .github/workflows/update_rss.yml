name: Actualizar RSS canales

on:
  schedule:
    - cron: '0 6 * * *'   # Cada día a las 6:00 UTC
  workflow_dispatch:      # Permite lanzarlo manualmente desde GitHub

permissions:
  contents: write         # Otorga permisos al bot para hacer push al repositorio

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar script de actualización
        run: python update_rss.py

      - name: Commit y push de los cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          
          # Si no hay cambios en el stage, el script termina el paso con éxito. 
          # Si los hay, hace el commit.
          git diff --cached --quiet || git commit -m "🤖 Auto-update RSS canales $(date +'%Y-%m-%d')"
          
          # Trae posibles cambios del repositorio antes de subir para evitar conflictos
          git pull --rebase origin main
          git push
          
